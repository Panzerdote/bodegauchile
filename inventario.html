<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVENTARIO - CEHAQ</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="img/escudo.svg">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="escudo-container"><img src="img/escudo.svg" alt="Escudo" class="escudo-svg"></div>
            <h2>CEHAQ</h2>
            <p>SISTEMA DE BODEGA</p>
        </div>
        <nav>
            <div class="sidebar-section">
                <div class="sidebar-section-title">PRINCIPAL</div>
                <ul class="sidebar-menu">
                    <li><a href="index.html"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>DASHBOARD</a></li>
                    <li><a href="inventario.html" class="active"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>INVENTARIO<span class="badge-menu" id="total-badge">0</span></a></li>
                    <li><a href="movimientos.html"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>MOVIMIENTOS</a></li>
                </ul>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">OPERACIONES</div>
                <ul class="sidebar-menu">
                    <li><a href="#" id="btn-ingreso"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>NUEVO INGRESO</a></li>
                    <li><a href="#" id="btn-salida"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>NUEVA SALIDA</a></li>
                </ul>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">CONFIGURACIÓN</div>
                <ul class="sidebar-menu">
                    <li><a href="#" id="btn-exportar"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>EXPORTAR EXCEL</a></li>
                </ul>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">CUENTA</div>
                <ul class="sidebar-menu">
                    <li><a href="#" onclick="cerrarSesion()"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/></svg>CERRAR SESIÓN<span style="font-size:9px; color:var(--accent-light); margin-left:auto;" id="user-name-display"></span></a></li>
                </ul>
            </div>
        </nav>
        <div class="sidebar-footer"><span id="connection-status"><svg viewBox="0 0 24 24" width="10" height="10" fill="#f39c12"><circle cx="12" cy="12" r="6"/></svg> CONECTANDO...</span><br>v5.0 | SUPABASE</div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="hamburger" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <img src="img/escudo.svg" alt="Escudo" class="header-escudo-small">
                <h1>INVENTARIO COMPLETO</h1>
                <span class="badge badge-accent" id="bodega-activa" style="margin-left:10px; font-size:11px;">BODEGA</span>
                <button class="btn btn-sm btn-accent" onclick="cambiarBodega()" style="margin-left:10px; font-size:10px;">CAMBIAR</button>
            </div>
            <div class="header-actions">
                <button class="btn btn-success" onclick="Modales.showIngreso(App.state)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>INGRESO</button>
                <button class="btn btn-danger" onclick="Modales.showSalida(App.state)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>SALIDA</button>
            </div>
        </header>

        <div class="container">
            <div class="section">
                <div style="display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap; align-items:center;">
                    <span style="font-size:12px; color:#666; font-weight:600;">FILTRAR POR:</span>
                    <label style="display:flex; align-items:center; gap:5px; cursor:pointer; font-size:12px;"><input type="checkbox" id="filtro-stock-critico"> STOCK CRÍTICO</label>
                    <label style="display:flex; align-items:center; gap:5px; cursor:pointer; font-size:12px;"><input type="checkbox" id="filtro-por-vencer"> POR VENCER</label>
                    <label style="display:flex; align-items:center; gap:5px; cursor:pointer; font-size:12px;"><input type="checkbox" id="filtro-vencidos"> VENCIDOS</label>
                    <input type="text" class="search-box" id="busqueda-inventario" placeholder="🔍 BUSCAR POR NOMBRE, LOTE, CB O ANAQUEL..." style="flex:1; min-width:200px; margin-bottom:0;">
                    <span style="font-size:11px; color:#888; margin-left:auto;">MOSTRANDO: <strong id="contador-inventario">0</strong> INSUMOS</span>
                </div>
                <div class="table-responsive"><div class="table-container" id="tabla-inventario"></div></div>
            </div>
        </div>
    </main>

    <div id="modal" class="modal"><div class="modal-content" id="modal-content"></div></div>
    <div id="toast" class="toast" style="display:none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="js/config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/modales.js"></script>
    <script src="js/app.js"></script>
    <script src="js/inventario.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const auth = checkAuth();
            if (!auth) return;
            
            document.getElementById('bodega-activa').textContent = auth.bodega;
            document.getElementById('user-name-display').textContent = (auth.user.nombre || auth.user.usuario).toUpperCase();
            
            // Configurar eventos de botones
            document.getElementById('btn-ingreso').addEventListener('click', (e) => { e.preventDefault(); Modales.showIngreso(App.state); });
            document.getElementById('btn-salida').addEventListener('click', (e) => { e.preventDefault(); Modales.showSalida(App.state); });
            document.getElementById('btn-exportar').addEventListener('click', (e) => { e.preventDefault(); App.exportarExcel(); });
            
            UI.setConnectionStatus('warning', 'CONECTANDO...');
            await App.init();
            InventarioModule.init();
            UI.setConnectionStatus('success', 'CONECTADO');
        });
    </script>
</body>
</html>
