<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEHAQ - Seleccionar Bodega</title>
    <style>
        :root {
            --primary: #1a3a6b;
            --primary-dark: #0f2447;
            --accent: #c9a84c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 650px;
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 3px solid var(--accent);
        }

        .header img {
            width: 60px;
            height: 80px;
            margin-bottom: 15px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .body {
            padding: 30px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 10px;
            color: #555;
            font-size: 14px;
        }

        .welcome strong {
            color: var(--primary);
        }

        .subtitle {
            text-align: center;
            margin-bottom: 25px;
            color: #888;
            font-size: 13px;
        }

        /* BOTONES EN FILA */
        .bodegas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .bodega-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            background: white;
        }

        .bodega-card:hover {
            border-color: var(--primary);
            background: #f0f4ff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .bodega-card .icon-svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .bodega-card h3 {
            font-size: 16px;
            color: var(--primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bodega-card p {
            font-size: 11px;
            color: #888;
            line-height: 1.4;
        }

        .btn-logout {
            display: block;
            width: 100%;
            padding: 10px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: #e0e0e0;
            color: #333;
        }

        @media (max-width: 500px) {
            .bodegas-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="img/escudo.svg" alt="CEHAQ">
            <h1>CEHAQ</h1>
            <p>SELECCIONAR ÁREA DE TRABAJO</p>
        </div>
        <div class="body">
            <p class="welcome">BIENVENIDO, <strong id="nombre-usuario"></strong></p>
            <p class="subtitle">SELECCIONE EL MÓDULO DONDE DESEA TRABAJAR:</p>

            <div class="bodegas-grid">
                
                <a href="index.html" class="bodega-card" onclick="seleccionarBodega('BODEGA')">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <h3>BODEGA</h3>
                    <p>GESTIÓN COMPLETA DE INSUMOS CLÍNICOS CON SECCIONES Y ANAQUELES</p>
                </a>

                <<a href="index.html" class="bodega-card" onclick="seleccionarBodega('BOTIQUIN')">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                    <h3>BOTIQUÍN</h3>
                    <p>CONTROL DE FÁRMACOS Y MEDICAMENTOS DE USO INMEDIATO</p>
                </a>
            </div>

            <button class="btn-logout" onclick="cerrarSesion()">CERRAR SESIÓN</button>
        </div>
    </div>

    <script>
        (() => {
            const userData = localStorage.getItem('cehaq_user');
            if (!userData) { window.location.href = 'login.html'; return; }
            const user = JSON.parse(userData);
            if (!user.activo) { window.location.href = 'login.html'; return; }
            document.getElementById('nombre-usuario').textContent = (user.nombre || user.usuario).toUpperCase();
        })();

        function seleccionarBodega(bodega) {
            localStorage.setItem('cehaq_bodega', bodega);
        }

        function cerrarSesion() {
            localStorage.removeItem('cehaq_user');
            localStorage.removeItem('cehaq_bodega');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
