<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEHAQ - Seleccionar Bodega</title>
    <style>
        :root { --primary: #1a3a6b; --primary-dark: #0f2447; --accent: #c9a84c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); width: 100%; max-width: 500px; overflow: hidden; }
        .header { background: var(--primary); color: white; padding: 30px; text-align: center; border-bottom: 3px solid var(--accent); }
        .header img { width: 60px; height: 80px; margin-bottom: 15px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .header h1 { font-size: 20px; margin-bottom: 5px; }
        .header p { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .body { padding: 30px; }
        .body .welcome { text-align: center; margin-bottom: 25px; color: #555; font-size: 14px; }
        .bodega-card { display: block; padding: 25px; margin-bottom: 15px; border: 2px solid #e0e0e0; border-radius: 10px; text-align: center; cursor: pointer; transition: all 0.2s; text-decoration: none; color: inherit; }
        .bodega-card:hover { border-color: var(--primary); background: #f0f4ff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .bodega-card h3 { font-size: 18px; color: var(--primary); margin-bottom: 8px; }
        .bodega-card p { font-size: 13px; color: #888; margin-bottom: 0; }
        .bodega-card .icon { font-size: 40px; margin-bottom: 10px; }
        .btn-logout { display: block; width: 100%; padding: 10px; background: #f0f0f0; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; color: #666; margin-top: 10px; }
        .btn-logout:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="img/escudo.svg" alt="CEHAQ">
            <h1>CEHAQ</h1>
            <p>SELECCIONAR BODEGA</p>
        </div>
        <div class="body">
            <p class="welcome">BIENVENIDO, <strong id="nombre-usuario"></strong></p>
            <p class="welcome">SELECCIONE DÓNDE DESEA TRABAJAR:</p>
            
            <a href="index.html" class="bodega-card" onclick="seleccionarBodega('BODEGA')">
                <div class="icon">📦</div>
                <h3>BODEGA</h3>
                <p>SISTEMA COMPLETO CON SECCIONES Y ANAQUELES</p>
            </a>
            
            <a href="index.html" class="bodega-card" onclick="seleccionarBodega('BOTIQUIN')">
                <div class="icon">💊</div>
                <h3>BOTIQUÍN</h3>
                <p>GESTIÓN SIMPLIFICADA DE INSUMOS</p>
            </a>
            
            <button class="btn-logout" onclick="cerrarSesion()">CERRAR SESIÓN</button>
        </div>
    </div>

    <script>
        (() => {
            const userData = localStorage.getItem('cehaq_user');
            if (!userData) { window.location.href = 'login.html'; return; }
            const user = JSON.parse(userData);
            if (!user.activo) { window.location.href = 'login.html'; return; }
            document.getElementById('nombre-usuario').textContent = (user.nombre || user.usuario).toUpperCase();
        })();

        function seleccionarBodega(bodega) {
            localStorage.setItem('cehaq_bodega', bodega);
        }

        function cerrarSesion() {
            localStorage.removeItem('cehaq_user');
            localStorage.removeItem('cehaq_bodega');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
